name: Photo correction status debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-correction-status.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deploy and verify confirmed duplicate fixes
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 10 --max-time 120 "https://order.bujafood.kr/api/store" > /tmp/store.json 2>/dev/null; then
              if python - <<'PY'
          import json,sys
          with open("/tmp/store.json",encoding="utf-8") as f:
              d=json.load(f)
          byid={p.get("id"):p for p in (d.get("products") or [])}
          expected_old={
              "ERP-30643":"/api/photo?id=catalog-615db3ec9ed2d8ee7af6.webp",
              "ERP-32748":"/api/photo?id=catalog-615db3ec9ed2d8ee7af6.webp",
              "ERP-9014":"/api/photo?id=catalog-7b217682974689d8d309.webp",
              "ERP-9018":"/api/photo?id=catalog-7b217682974689d8d309.webp",
              "ERP-30257":"/api/photo?id=catalog-d3735b48e534920b9ce7.webp",
              "ERP-31204":"/api/photo?id=catalog-d3735b48e534920b9ce7.webp",
          }
          still_old=[]
          for product_id,old in expected_old.items():
              p=byid.get(product_id)
              if p and (p.get("photo") or "")==old:
                  still_old.append(product_id)
          print("attempt status; still_old=",",".join(still_old))
          if still_old:
              sys.exit(1)
          PY
              then
                python - <<'PY'
          import json
          from collections import defaultdict
          with open("/tmp/store.json",encoding="utf-8") as f:
              d=json.load(f)
          ps=d.get("products") or []
          byid={p.get("id"):p for p in ps}
          targets=["ERP-30643","ERP-32748","ERP-9014","ERP-9018","ERP-30257","ERP-31204"]
          print("LIVE_PRODUCT_COUNT",len(ps))
          print("=== FIXED TARGETS ===")
          for product_id in targets:
              p=byid.get(product_id)
              print(product_id,(p or {}).get("name",""),(p or {}).get("photo",""),sep="\t")
          PY
                exit 0
              fi
            fi
            sleep 15
          done
          exit 1
