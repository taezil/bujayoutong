name: Export live catalog photo index

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-photo-live-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for one-shot review endpoint and export catalog
        shell: python
        run: |
          import json, pathlib, time, urllib.request
          root=pathlib.Path("live-catalog-index")
          root.mkdir(exist_ok=True)
          url="https://order.bujafood.kr/api/store?catalogPhotoReviewAll=1"
          data=None
          for attempt in range(80):
              try:
                  with urllib.request.urlopen(url,timeout=90) as r:
                      data=json.loads(r.read())
                  if data.get("catalogPhotoReviewAll") is True and len(data.get("products") or []) >= 700:
                      break
              except Exception:
                  pass
              time.sleep(10)
          if not data or data.get("catalogPhotoReviewAll") is not True:
              raise SystemExit("one-shot catalog review endpoint unavailable")
          products=data.get("products") or []
          print("TOTAL",len(products))
          for i,p in enumerate(products,1):
              print(f'{i:03d}\t{p.get("id","")}\t{p.get("name","")}\t{p.get("unit","")}\t{p.get("photo","")}')
          (root/"catalog.json").write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")

      - name: Upload live index
        uses: actions/upload-artifact@v4
        with:
          name: live-catalog-index
          path: live-catalog-index
          retention-days: 2
