name: Build & auth checks

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "tests/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/auth-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck (same check that runs before Cloudflare deploy)
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build
      - name: Generated route tree is up to date
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Start local worker (vite preview, local D1/R2)
        if: hashFiles('tests/auth-e2e.mjs') != ''
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4173/robots.txt; then echo "up"; exit 0; fi
            sleep 2
          done
          cat preview.log; exit 1
      - name: Install Playwright Chromium
        if: hashFiles('tests/auth-e2e.mjs') != ''
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: End-to-end auth checks
        if: hashFiles('tests/auth-e2e.mjs') != ''
        run: node tests/auth-e2e.mjs http://localhost:4173
      - name: Worker log
        if: always() && hashFiles('tests/auth-e2e.mjs') != ''
        run: tail -n 200 preview.log || true
