name: Export live catalog photo index

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalog-photo-live-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for catalog review endpoint and export pages
        shell: python
        run: |
          import json, pathlib, time, urllib.request
          root=pathlib.Path("live-catalog-index")
          root.mkdir(exist_ok=True)
          base="https://order.bujafood.kr/api/store?catalogPhotoReview=1&page={}"
          first=None
          for attempt in range(80):
              try:
                  with urllib.request.urlopen(base.format(17),timeout=60) as r:
                      first=json.loads(r.read())
                  if first.get("catalogPhotoReview") is True:
                      break
              except Exception:
                  pass
              time.sleep(10)
          if not first or first.get("catalogPhotoReview") is not True:
              raise SystemExit("catalog review endpoint unavailable")
          all_pages=[]
          for page in range(15, int(first.get("pages",36))+1):
              if page==17:
                  data=first
              else:
                  with urllib.request.urlopen(base.format(page),timeout=60) as r:
                      data=json.loads(r.read())
              all_pages.append(data)
              print("PAGE",page,"RANGE",data.get("startIndex"),data.get("endIndex"))
              for i,p in enumerate(data.get("products") or [], data.get("startIndex",1)):
                  print(f'{i:03d}\t{p.get("id","")}\t{p.get("name","")}\t{p.get("unit","")}\t{p.get("photo","")}')
          (root/"pages-15-end.json").write_text(json.dumps(all_pages,ensure_ascii=False,indent=2),encoding="utf-8")

      - name: Upload live index
        uses: actions/upload-artifact@v4
        with:
          name: live-catalog-index
          path: live-catalog-index
          retention-days: 2
