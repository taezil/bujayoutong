name: Photo correction status debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-correction-status.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deploy and verify pepper photo split
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 10 --max-time 120 "https://order.bujafood.kr/api/store" > /tmp/store.json 2>/dev/null; then
              if python - <<'PY'
          import json,sys
          with open("/tmp/store.json",encoding="utf-8") as f:
              d=json.load(f)
          byid={p.get("id"):p for p in (d.get("products") or [])}
          old="/api/photo?id=catalog-147ad117a97a5076f53f.webp"
          targets=["ERP-9013","ERP-9028"]
          still_old=[i for i in targets if i in byid and (byid[i].get("photo") or "")==old]
          print("still_old=",",".join(still_old))
          if still_old: sys.exit(1)
          for i in targets:
              p=byid.get(i)
              print(i,(p or {}).get("name",""),(p or {}).get("photo",""),sep="\t")
          PY
              then
                exit 0
              fi
            fi
            sleep 15
          done
          exit 1
