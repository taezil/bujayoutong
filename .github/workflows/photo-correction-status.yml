name: Photo correction status debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-correction-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read correction status
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ok=1
            echo "=== attempt $i ==="
            for page in 9 10; do
              url="https://order.bujafood.kr/api/store?page${page}PhotoStatus=1"
              if out="$(curl -fsS --connect-timeout 10 --max-time 120 "$url" 2>/dev/null)"; then
                echo "PAGE${page} $out"
              else
                echo "PAGE${page} endpoint unavailable"
                ok=0
              fi
            done
            if [ "$ok" = "1" ]; then exit 0; fi
            sleep 10
          done
          exit 1
