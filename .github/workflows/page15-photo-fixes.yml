name: Verify admin page 15 photo fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/page15-photo-fixes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deployment and verify page 15 corrections
        shell: bash
        run: |
          set -euo pipefail
          URL="https://order.bujafood.kr/api/store?page15CorrectionStatus=1"
          for i in $(seq 1 80); do
            if out="$(curl -fsS --connect-timeout 10 --max-time 120 "$URL" 2>/dev/null)"; then
              echo "attempt=$i $out"
              if printf '%s' "$out" | python -c 'import json,sys; d=json.load(sys.stdin); ps=d.get("products") or []; ok=d.get("page15CorrectionStatus") is True and d.get("done") is True and not d.get("error") and len(ps)==11 and all((p.get("photo") or "").strip() for p in ps); raise SystemExit(0 if ok else 1)'; then
                printf '%s' "$out" > /tmp/page15-verified.json
                break
              fi
            fi
            sleep 10
          done
          test -s /tmp/page15-verified.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/page15-verified.json"))
          for p in d["products"]:
              print("PHOTO_OK", p["id"], p["name"], p["photo"])
          PY
