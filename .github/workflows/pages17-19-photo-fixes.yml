name: Verify admin pages 17-19 photo fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages17-19-photo-fixes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deployment and verify live photo paths
        shell: python
        run: |
          import json, time, urllib.request
          expected = {
            "ERP-32575": "/api/photo?id=catalog-admin-page17-321-erp-32575.webp",
            "ERP-31388": "/api/photo?id=catalog-admin-page17-324-erp-31388.webp",
            "ERP-32275": "/api/photo?id=catalog-admin-page17-329-erp-32275.webp",
            "ERP-30495": "/api/photo?id=catalog-admin-page17-330-erp-30495.webp",
            "ERP-32992": "/api/photo?id=catalog-admin-page17-331-erp-32992.webp",
            "ERP-30223": "/api/photo?id=catalog-admin-page17-333-erp-30223.webp",
            "ERP-32968": "/api/photo?id=catalog-admin-page18-341-erp-32968.webp",
            "ERP-32600": "/api/photo?id=catalog-admin-page18-342-erp-32600.webp",
            "ERP-31460": "/api/photo?id=catalog-admin-page18-355-erp-31460.webp",
            "ERP-32810": "/api/photo?id=catalog-admin-page18-356-erp-32810.webp",
            "ERP-32941": "/api/photo?id=catalog-admin-page18-357-erp-32941.webp",
            "ERP-31391": "/api/photo?id=catalog-admin-page18-359-erp-31391.webp",
            "ERP-31571": "/api/photo?id=catalog-admin-page18-360-erp-31571.webp",
            "ERP-32483": "/api/photo?id=catalog-admin-page19-361-erp-32483.webp",
            "ERP-32885": "/api/photo?id=catalog-admin-page19-364-erp-32885.webp",
            "ERP-31871": "/api/photo?id=catalog-admin-page19-374-erp-31871.webp",
            "ERP-32914": "/api/photo?id=catalog-admin-page19-375-erp-32914.webp",
          }
          url = "https://order.bujafood.kr/api/store?catalogPhotoReviewAll=1"
          last = {}
          for attempt in range(1, 81):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (GitHub Actions Catalog Review)","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = json.loads(r.read())
                  photos = {p.get("id"): p.get("photo","") for p in data.get("products") or []}
                  last = {k: photos.get(k,"") for k in expected}
                  bad = {k:(last[k],v) for k,v in expected.items() if last[k] != v}
                  print("attempt", attempt, "remaining", len(bad))
                  if not bad:
                      print("PAGES17_19_FIXES_OK", len(expected))
                      for k,v in expected.items():
                          print("PHOTO_OK", k, v)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("attempt", attempt, "error", exc)
              time.sleep(10)
          print("FINAL_MISMATCH", {k:(last.get(k),v) for k,v in expected.items() if last.get(k) != v})
          raise SystemExit(1)
