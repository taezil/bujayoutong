name: Photo correction status debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-correction-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose live photo response
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://order.bujafood.kr/api/photo?id=catalog-page8-erp-32829.webp"
          curl -fsSL --compressed -A "Mozilla/5.0" -D /tmp/headers.txt "$URL" -o /tmp/photo.bin
          cat /tmp/headers.txt
          file /tmp/photo.bin
          wc -c /tmp/photo.bin
          xxd -l 128 /tmp/photo.bin
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/photo.bin").read_bytes()
          print("FIRST16",p[:16])
          print("TEXT_HEAD",p[:500].decode("utf-8","replace"))
          PY
