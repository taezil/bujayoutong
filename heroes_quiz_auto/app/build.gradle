plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.taezil.heroesquizauto'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.taezil.heroesquizauto'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
