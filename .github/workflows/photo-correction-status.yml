name: Photo correction status debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-correction-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect original ChatGPT 141-283 assignment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 120 "https://order.bujafood.kr/api/store" > /tmp/store.json
          python - <<'PY'
          import json
          from collections import defaultdict
          ids=["ERP-30329","ERP-31856","ERP-30102","ERP-1024","ERP-32829","ERP-32832","ERP-31351","ERP-32409","ERP-33007","ERP-30112","ERP-31410","ERP-30185","ERP-30634","ERP-1013","ERP-32440","ERP-1051","ERP-30349","ERP-32478","ERP-30397","ERP-32852","ERP-31869","ERP-1063","ERP-32428","ERP-30942","ERP-32974","ERP-31962","ERP-31964","ERP-32775","ERP-31966","ERP-32978","ERP-32255","ERP-32655","ERP-31697","ERP-1027","ERP-31263","ERP-1045","ERP-30740","ERP-32644","ERP-30986","ERP-32781","ERP-31321","ERP-32016","ERP-32197","ERP-8013","ERP-32399","ERP-1021","ERP-1072","ERP-9012","ERP-31247","ERP-1073","ERP-30233","ERP-1074","ERP-32085","ERP-1052","ERP-32257","ERP-1053","ERP-1054","ERP-1055","ERP-9006","ERP-9009","ERP-9010","ERP-30654","ERP-9007","ERP-30227","ERP-6010","ERP-30463","ERP-30207","ERP-33000","ERP-31839","ERP-32261","ERP-32361","ERP-30424","ERP-31340","ERP-6012","ERP-31724","ERP-31040","ERP-31518","ERP-31292","ERP-32199","ERP-8025","ERP-6016","ERP-32766","ERP-31586","ERP-31458","ERP-31038","ERP-30923","ERP-31045","ERP-6017","ERP-32664","ERP-5005","ERP-32579","ERP-8048","ERP-32422","ERP-5014","ERP-32377","ERP-5011","ERP-5012","ERP-8058","ERP-7004","ERP-7011","ERP-30653","ERP-32167","ERP-7006","ERP-31517","ERP-8167","ERP-30257","ERP-8019","ERP-31203","ERP-30911","ERP-9013","ERP-9014","ERP-9028","ERP-30272","ERP-32476","ERP-31204","ERP-8102","ERP-8103","ERP-31929","ERP-31164","ERP-31687","ERP-8140","ERP-8142","ERP-32977","ERP-32857","ERP-8076","ERP-8077","ERP-31215","ERP-8079","ERP-31413","ERP-9018","ERP-8091","ERP-8151","ERP-8145","ERP-31830","ERP-30933","ERP-30643","ERP-8024","ERP-32748","ERP-32948","ERP-31648","ERP-8051","ERP-8053","ERP-31246"]
          task_by_id={v:i+141 for i,v in enumerate(ids)}
          with open("/tmp/store.json",encoding="utf-8") as f:
              d=json.load(f)
          ps=d.get("products") or []
          byid={p.get("id"):p for p in ps}
          alive=[byid[i] for i in ids if i in byid]
          missing=[i for i in ids if i not in byid]
          issues=[]
          for p in alive:
              if not (p.get("photo") or "").strip() or "이미지수정필요" in (p.get("name") or ""):
                  issues.append(p)
          dup=defaultdict(list)
          for p in alive:
              photo=(p.get("photo") or "").strip()
              if photo:
                  dup[photo].append(p)
          groups=[(photo,rows) for photo,rows in dup.items() if len(rows)>1]
          print("LIVE_PRODUCT_COUNT",len(ps))
          print("ASSIGNMENT_ALIVE",len(alive),"DELETED",len(missing),"ISSUES",len(issues),"DUP_GROUPS",len(groups))
          print("=== BLANK_OR_FLAGGED ===")
          for p in issues:
              print(task_by_id[p["id"]],p.get("id",""),p.get("name",""),p.get("unit",""),p.get("photo",""),sep="\t")
          print("=== DUPLICATE_PHOTO_GROUPS ===")
          for photo,rows in sorted(groups,key=lambda x:(-len(x[1]),x[0])):
              print("PHOTO",photo)
              for p in rows:
                  print(task_by_id[p["id"]],p.get("id",""),p.get("name",""),p.get("unit",""),sep="\t")
          print("=== DELETED_ASSIGNMENT_IDS ===")
          print(",".join(missing))
          PY
