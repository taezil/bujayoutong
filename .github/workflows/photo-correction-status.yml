name: Photo correction status debug

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-correction-status.yml"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read current live product pages
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --connect-timeout 10 --max-time 120 "https://order.bujafood.kr/api/store" > /tmp/store.json 2>/dev/null; then
              python - <<'PY'
          import json
          with open("/tmp/store.json", encoding="utf-8") as f:
              d=json.load(f)
          ps=d.get("products") or []
          print("LIVE_PRODUCT_COUNT", len(ps))
          for page in range(11, 16):
              a=(page-1)*20; b=min(page*20,len(ps))
              print(f"=== LIVE PAGE {page} positions {a+1}-{b} ===")
              for pos,p in enumerate(ps[a:b], start=a+1):
                  print(pos, p.get("id",""), p.get("name",""), p.get("unit",""), p.get("photo",""), sep="\t")
          PY
              exit 0
            fi
            sleep 10
          done
          exit 1
