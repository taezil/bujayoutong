name: Review catalog photo page 16

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-photo-page16.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deployment and fetch live page 16
        shell: bash
        run: |
          set -euo pipefail
          URL="https://order.bujafood.kr/api/store?catalogPhotoReview=1&page=16"
          for i in $(seq 1 80); do
            if out="$(curl -fsS --connect-timeout 10 --max-time 90 "$URL" 2>/dev/null)"; then
              if printf '%s' "$out" | python -c 'import json,sys; d=json.load(sys.stdin); ok=d.get("catalogPhotoReview") is True and d.get("page")==16 and len(d.get("products") or [])==20; raise SystemExit(0 if ok else 1)'; then
                printf '%s' "$out" > /tmp/page16.json
                break
              fi
            fi
            sleep 10
          done
          test -s /tmp/page16.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/page16.json"))
          print("PAGE",d["page"],"TOTAL",d["total"],"RANGE",d["startIndex"],d["endIndex"])
          for i,p in enumerate(d["products"], d["startIndex"]):
              print(f'{i:03d}\t{p["id"]}\t{p["name"]}\t{p.get("unit","")}\t{p.get("photo","")}')
          PY

      - name: Download live page 16 photos
        shell: python
        run: |
          import json, pathlib, urllib.request
          root=pathlib.Path("page16-review")
          root.mkdir(exist_ok=True)
          d=json.load(open("/tmp/page16.json"))
          for i,p in enumerate(d["products"], d["startIndex"]):
              photo=(p.get("photo") or "").strip()
              if not photo:
                  continue
              url="https://order.bujafood.kr"+photo
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"image/webp,image/*,*/*;q=0.8"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read()
                  (root/f"{i:03d}__{p['id']}.img").write_bytes(body)
              except Exception as exc:
                  print("DOWNLOAD_FAIL",i,p["id"],exc)
          (root/"manifest.json").write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding="utf-8")

      - name: Upload live review bundle
        uses: actions/upload-artifact@v4
        with:
          name: page16-live-review
          path: page16-review
          retention-days: 2
