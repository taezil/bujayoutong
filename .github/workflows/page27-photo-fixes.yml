name: Verify admin page 27 photo fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/page27-photo-fixes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deployment and verify live photo paths
        shell: python
        run: |
          import json, time, urllib.request
          expected = {
            "ERP-32987": "/api/photo?id=catalog-admin-page27-521-erp-32987.webp",
            "ERP-33008": "/api/photo?id=catalog-admin-page27-522-erp-33008.webp",
            "ERP-33016": "/api/photo?id=catalog-admin-page27-524-erp-33016.webp",
            "ERP-33017": "/api/photo?id=catalog-admin-page27-525-erp-33017.webp",
            "ERP-33012": "/api/photo?id=catalog-admin-page27-526-erp-33012.webp",
            "ERP-33014": "/api/photo?id=catalog-admin-page27-527-erp-33014.webp",
            "ERP-33015": "/api/photo?id=catalog-admin-page27-528-erp-33015.webp",
            "ERP-33020": "/api/photo?id=catalog-admin-page27-529-erp-33020.webp",
            "ERP-33019": "/api/photo?id=catalog-admin-page27-530-erp-33019.webp",
            "ERP-33018": "/api/photo?id=catalog-admin-page27-531-erp-33018.webp",
            "ERP-30311": "/api/photo?id=catalog-admin-page27-536-erp-30311.webp",
            "ERP-30342": "/api/photo?id=catalog-admin-page27-540-erp-30342.webp",
          }
          url = "https://order.bujafood.kr/api/store?catalogPhotoReviewAll=1"
          last = {}
          for attempt in range(1, 81):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (GitHub Actions Catalog Review)","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = json.loads(r.read())
                  photos = {p.get("id"): p.get("photo","") for p in data.get("products") or []}
                  last = {k: photos.get(k,"") for k in expected}
                  bad = {k:(last[k],v) for k,v in expected.items() if last[k] != v}
                  print("attempt", attempt, "remaining", len(bad))
                  if not bad:
                      print("PAGE27_FIXES_OK", len(expected))
                      for k,v in expected.items():
                          print("PHOTO_OK", k, v)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("attempt", attempt, "error", exc)
              time.sleep(10)
          print("FINAL_MISMATCH", {k:(last.get(k),v) for k,v in expected.items() if last.get(k) != v})
          raise SystemExit(1)
