name: Catalog Photo Autofill
# parser-v2 retry

on:
  push:
    paths:
      - ".github/workflows/catalog-photo-autofill.yml"
  workflow_dispatch:

jobs:
  autofill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fill missing catalog photos into R2
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://order.bujafood.kr/api/store"
          TOKEN="buja-photo-20261025-f6e3d9a4"

          echo "Waiting for deployed autofill endpoint..."
          READY=0
          for i in $(seq 1 90); do
            OUT="$(curl -fsS --max-time 30 "$BASE?photoAutoStatus=1&token=$TOKEN" || true)"
            echo "$OUT"
            if echo "$OUT" | grep -q '"targetProducts"'; then
              READY=1
              break
            fi
            sleep 5
          done
          if [ "$READY" != "1" ]; then
            echo "Autofill endpoint did not become ready"
            exit 1
          fi

          for i in $(seq 1 80); do
            OUT="$(curl -fsS --max-time 120 "$BASE?photoAutoFill=1&token=$TOKEN&limit=10")"
            echo "$OUT"
            BLANK="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("blankProducts",9999))')"
            PROCESSED="$(printf '%s' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("processed",0))')"
            if [ "$BLANK" = "0" ] || [ "$PROCESSED" = "0" ]; then
              break
            fi
          done

          echo "FINAL_STATUS"
          curl -fsS --max-time 30 "$BASE?photoAutoStatus=1&token=$TOKEN"
          echo
