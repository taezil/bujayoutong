name: Verify visual photo corrections

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photo-correction-status.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Wait for deployment and verify corrected photos
        shell: bash
        run: |
          set -euo pipefail
          URL="https://order.bujafood.kr/api/store?visual141283PhotoStatus=1"
          for i in $(seq 1 60); do
            if out="$(curl -fsS --connect-timeout 10 --max-time 120 "$URL" 2>/dev/null)"; then
              echo "attempt=$i $out"
              if printf '%s' "$out" | python -c '
import json,sys
d=json.load(sys.stdin)
ps={p["id"]:p.get("photo","") for p in d.get("products") or []}
expected={
"ERP-32409":"/api/photo?id=catalog-original-148-croaker-fillet.webp",
"ERP-30634":"/api/photo?id=catalog-original-cut-jaban-mackerel.webp",
"ERP-32440":"/api/photo?id=catalog-original-cut-jaban-mackerel.webp",
"ERP-32644":"/api/photo?id=catalog-original-cleaned-baby-octopus.webp",
"ERP-30986":"/api/photo?id=catalog-original-cleaned-baby-octopus.webp",
"ERP-32781":"/api/photo?id=catalog-original-cleaned-baby-octopus.webp",
"ERP-32016":"/api/photo?id=catalog-original-182-cocktail-shrimp-900g.webp",
"ERP-31040":"/api/photo?id=catalog-original-216-pork-strips.webp",
"ERP-32766":"/api/photo?id=catalog-original-222-beef-head-meat.webp",
}
ok=(d.get("visual141283PhotoStatus") is True and d.get("done") is True and not d.get("error") and all(ps.get(k)==v for k,v in expected.items()))
raise SystemExit(0 if ok else 1)
'; then
                printf '%s' "$out" > /tmp/verified.json
                break
              fi
            fi
            sleep 15
          done
          test -s /tmp/verified.json
          cat /tmp/verified.json

          python - <<'PY'
          import json, subprocess
          d=json.load(open("/tmp/verified.json"))
          for p in d["products"]:
              url="https://order.bujafood.kr"+p["photo"]
              subprocess.run(["curl","-fsS","--max-time","60","-o","/dev/null",url],check=True)
              print("PHOTO_OK",p["id"],p["name"],p["photo"])
          PY
