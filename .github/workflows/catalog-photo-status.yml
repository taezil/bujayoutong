name: Catalog Photo Status Snapshot

on:
  push:
    paths:
      - ".github/workflows/catalog-photo-status.yml"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current photo status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 "https://order.bujafood.kr/api/store?photoAutoStatus=1&token=buja-photo-20261025-f6e3d9a4" | tee photo-status.json
          echo
          curl -fsS --max-time 60 --get --data-urlencode "photoSearchTest=1" --data-urlencode "q=새우튀김 업소용 대용량 식자재" "https://order.bujafood.kr/api/store" | tee photo-search-test.json
      - name: Upload status
        uses: actions/upload-artifact@v4
        with:
          name: photo-status
          path: |
            photo-status.json
            photo-search-test.json
