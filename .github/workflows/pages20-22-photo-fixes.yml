name: Verify admin pages 20-22 photo fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages20-22-photo-fixes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deployment and verify live photo paths
        shell: python
        run: |
          import json, time, urllib.request
          expected = {
            "ERP-31521": "/api/photo?id=catalog-admin-page20-381-erp-31521.webp",
            "ERP-32266": "/api/photo?id=catalog-admin-page20-382-erp-32266.webp",
            "ERP-31524": "/api/photo?id=catalog-admin-page20-383-erp-31524.webp",
            "ERP-31931": "/api/photo?id=catalog-admin-page20-385-erp-31931.webp",
            "ERP-2008": "/api/photo?id=catalog-admin-page20-388-erp-2008.webp",
            "ERP-30435": "/api/photo?id=catalog-admin-page21-403-erp-30435.webp",
            "ERP-32985": "/api/photo?id=catalog-admin-page21-407-erp-32985.webp",
            "ERP-32168": "/api/photo?id=catalog-admin-page21-412-erp-32168.webp",
            "ERP-31467": "/api/photo?id=catalog-admin-page21-413-erp-31467.webp",
            "ERP-8108": "/api/photo?id=catalog-admin-page21-417-erp-8108.webp",
            "ERP-32981": "/api/photo?id=catalog-admin-page21-419-erp-32981.webp",
            "ERP-32560": "/api/photo?id=catalog-admin-page22-424-erp-32560.webp",
            "ERP-32830": "/api/photo?id=catalog-admin-page22-428-erp-32830.webp",
            "ERP-32322": "/api/photo?id=catalog-admin-page22-432-erp-32322.webp",
            "ERP-31828": "/api/photo?id=catalog-admin-page22-433-erp-31828.webp",
            "ERP-30581": "/api/photo?id=catalog-admin-page22-434-erp-30581.webp",
            "ERP-32986": "/api/photo?id=catalog-admin-page22-437-erp-32986.webp",
          }
          url = "https://order.bujafood.kr/api/store?catalogPhotoReviewAll=1"
          last = {}
          for attempt in range(1, 81):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (GitHub Actions Catalog Review)","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = json.loads(r.read())
                  photos = {p.get("id"): p.get("photo","") for p in data.get("products") or []}
                  last = {k: photos.get(k,"") for k in expected}
                  bad = {k:(last[k],v) for k,v in expected.items() if last[k] != v}
                  print("attempt", attempt, "remaining", len(bad))
                  if not bad:
                      print("PAGES20_22_FIXES_OK", len(expected))
                      for k,v in expected.items():
                          print("PHOTO_OK", k, v)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("attempt", attempt, "error", exc)
              time.sleep(10)
          print("FINAL_MISMATCH", {k:(last.get(k),v) for k,v in expected.items() if last.get(k) != v})
          raise SystemExit(1)
