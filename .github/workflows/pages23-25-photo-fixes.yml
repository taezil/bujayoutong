name: Verify admin pages 23-25 photo fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages23-25-photo-fixes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deployment and verify live photo paths
        shell: python
        run: |
          import json, time, urllib.request
          expected = {
            "ERP-31486": "/api/photo?id=catalog-admin-page23-441-erp-31486.webp",
            "ERP-30382": "/api/photo?id=catalog-admin-page23-444-erp-30382.webp",
            "ERP-31736": "/api/photo?id=catalog-admin-page23-448-erp-31736.webp",
            "ERP-31471": "/api/photo?id=catalog-admin-page23-457-erp-31471.webp",
            "ERP-33003": "/api/photo?id=catalog-admin-page24-470-erp-33003.webp",
            "ERP-32792": "/api/photo?id=catalog-admin-page24-474-erp-32792.webp",
            "ERP-32804": "/api/photo?id=catalog-admin-page24-475-erp-32804.webp",
            "ERP-31452": "/api/photo?id=catalog-admin-page24-479-erp-31452.webp",
            "ERP-31323": "/api/photo?id=catalog-admin-page25-481-erp-31323.webp",
            "ERP-32068": "/api/photo?id=catalog-admin-page25-484-erp-32068.webp",
            "ERP-20001": "/api/photo?id=catalog-admin-page25-485-erp-20001.webp",
            "ERP-32905": "/api/photo?id=catalog-admin-page25-494-erp-32905.webp",
            "ERP-32174": "/api/photo?id=catalog-admin-page25-495-erp-32174.webp",
            "ERP-30239": "/api/photo?id=catalog-admin-page25-498-erp-30239.webp",
            "ERP-32947": "/api/photo?id=catalog-admin-page25-499-erp-32947.webp",
          }
          url = "https://order.bujafood.kr/api/store?catalogPhotoReviewAll=1"
          last = {}
          for attempt in range(1, 81):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (GitHub Actions Catalog Review)","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = json.loads(r.read())
                  photos = {p.get("id"): p.get("photo","") for p in data.get("products") or []}
                  last = {k: photos.get(k,"") for k in expected}
                  bad = {k:(last[k],v) for k,v in expected.items() if last[k] != v}
                  print("attempt", attempt, "remaining", len(bad))
                  if not bad:
                      print("PAGES23_25_FIXES_OK", len(expected))
                      for k,v in expected.items():
                          print("PHOTO_OK", k, v)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("attempt", attempt, "error", exc)
              time.sleep(10)
          print("FINAL_MISMATCH", {k:(last.get(k),v) for k,v in expected.items() if last.get(k) != v})
          raise SystemExit(1)
