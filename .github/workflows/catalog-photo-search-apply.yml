name: Catalog Photo Search Apply

on:
  push:
    paths:
      - ".github/workflows/catalog-photo-search-apply.yml"
  workflow_dispatch:

jobs:
  search-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Search exact item images and save to R2
        run: python scripts/catalog_photo_search_apply.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-photo-search-report
          path: catalog-photo-search-report.json
          if-no-files-found: ignore
