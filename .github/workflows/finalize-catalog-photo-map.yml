name: Finalize Catalog Photo Map

on:
  push:
    paths:
      - ".github/workflows/finalize-catalog-photo-map.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch final R2 mapping and generate source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 "https://order.bujafood.kr/api/store?photoMap=1&token=buja-photo-20261025-f6e3d9a4" -o final-photo-map.json
          python - <<'PY'
          import json
          data = json.load(open("final-photo-map.json", encoding="utf-8"))
          rows = sorted((x["id"], x["photo"]) for x in data["mappings"])
          assert len(rows) == 566
          assert all(photo.startswith("/api/photo?id=") for _, photo in rows)
          with open("src/catalog-photo-final.generated.ts", "w", encoding="utf-8") as f:
              f.write("export const FINAL_CATALOG_PHOTOS = [\n")
              for product_id, photo in rows:
                  f.write("  [" + json.dumps(product_id, ensure_ascii=False) + "," + json.dumps(photo, ensure_ascii=False) + "],\n")
              f.write("] as const;\n")
          PY
      - name: Commit generated final mapping
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog-photo-final.generated.ts
          if git diff --cached --quiet; then
            echo "No mapping changes"
            exit 0
          fi
          git commit -m "Persist final 566 catalog R2 photo mappings"
          git push
