name: Build & auth checks

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "src/**"
      - "public/**"
      - "migrations/**"
      - "tests/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "wrangler.jsonc"
      - ".github/workflows/auth-ci.yml"
      - "desk/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck (same check that runs before Cloudflare deploy)
        run: npx tsc --noEmit
      - name: Build
        run: |
          npx vite build > build.log 2>&1 || { echo "::error title=vite build failed::$(tail -n 40 build.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          tail -n 5 build.log
      - name: Commit regenerated route tree (work branches only)
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "chore: regenerate route tree"
            git push
          fi
      - name: Start local worker (vite preview, local D1/R2)
        if: hashFiles('tests/auth-e2e.mjs') != ''
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:4173/robots.txt; then echo "up"; exit 0; fi
            sleep 2
          done
          cat preview.log; exit 1
      - name: Install Playwright Chromium
        if: hashFiles('tests/auth-e2e.mjs') != ''
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: End-to-end auth checks
        if: hashFiles('tests/auth-e2e.mjs') != ''
        run: node tests/auth-e2e.mjs http://localhost:4173
      - name: Delivery location checks (multiple accounts)
        if: always() && hashFiles('tests/delivery-e2e.mjs') != ''
        run: node tests/delivery-e2e.mjs http://localhost:4173
      - name: Desk alert center API checks (주문 확정 · 알림센터 서버 API)
        if: always() && hashFiles('tests/desk-e2e.mjs') != ''
        run: node tests/desk-e2e.mjs http://localhost:4173
      - uses: actions/setup-python@v5
        if: always() && hashFiles('desk/requirements.txt') != ''
        with:
          python-version: "3.12"
      - name: Desk program sync checks (두 PC 동기화 · 재연결 · 재시작)
        if: always() && hashFiles('desk/requirements.txt') != ''
        run: |
          python -m pip install -q -r desk/requirements.txt pytest
          set -o pipefail
          report() { echo "::error title=$1::$(tail -n 60 "$2" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          python -m pytest -q desk/tests/test_core.py 2>&1 | tee pytest.log || { report pytest pytest.log; exit 1; }
          python desk/tests/live_sync.py http://localhost:4173 2>&1 | tee live.log || { report live_sync live.log; exit 1; }
      - name: Desk program UI checks (offscreen)
        if: always() && hashFiles('desk/requirements.txt') != ''
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-noto-cjk > /dev/null
          set -o pipefail
          QT_DEBUG_PLUGINS=0 python -X faulthandler desk/tests/ui_live.py http://localhost:4173 2>&1 | tee ui.log || { echo "::error title=ui_live::$(tail -n 60 ui.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
      - name: Save desk screenshots to claude/screens branch (work branches only)
        if: always() && startsWith(github.ref, 'refs/heads/claude/') && hashFiles('desk-shot-*.png') != ''
        run: |
          mkdir -p /tmp/screens && cp desk-shot-*.png /tmp/screens/
          cd /tmp/screens
          git init -q -b screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "desk screenshots ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screens:refs/heads/claude/screens
      - name: Report results as annotations
        if: always() && hashFiles('tests/auth-e2e.mjs') != ''
        run: |
          if [ -f e2e-summary.txt ]; then echo "::notice title=E2E summary::$(grep -v '^PASS' e2e-summary.txt | sed ':a;N;$!ba;s/\n/%0A/g')"; fi
          for f in desk-summary.txt desk-live-summary.txt desk-ui-summary.txt; do
            if [ -f "$f" ]; then echo "::notice title=$f::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; fi
          done
          if [ -f delivery-summary.txt ]; then echo "::notice title=Delivery summary::$(sed ':a;N;$!ba;s/\n/%0A/g' delivery-summary.txt)"; fi
          if [ -f preview.log ]; then echo "::notice title=Worker log tail::$(tail -n 60 preview.log | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"; fi
