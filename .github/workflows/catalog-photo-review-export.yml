name: Catalog photo review export 1-283

on:
  push:
    paths:
      - '.github/workflows/catalog-photo-review-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current catalog photos 1-283
        shell: python
        run: |
          import json
          import pathlib
          import re
          import time
          import urllib.request

          root = pathlib.Path("review-1-283")
          root.mkdir(exist_ok=True)

          mapping_text = pathlib.Path("src/catalog-photo-final.generated.ts").read_text(encoding="utf-8")
          sql_text = pathlib.Path("src/catalog-sql.generated.ts").read_text(encoding="utf-8")

          mappings = re.findall(r'\["([^"]+)","([^"]+)"\]', mapping_text)[:283]

          product_re = re.compile(
              r"\('([^']+)','([^']*)','([^']*)','([^']*)','([^']*)',([^,]+),([^,]+),'([^']*)',(\d+),"
          )
          products = {}
          for m in product_re.finditer(sql_text):
              pid = m.group(1)
              if pid.startswith("ERP-"):
                  products[pid] = {
                      "name": m.group(2),
                      "category": m.group(3),
                      "sub": m.group(4),
                      "unit": m.group(5),
                      "sort_order": int(m.group(9)),
                  }

          manifest = []
          for index, (pid, photo) in enumerate(mappings, 1):
              meta = products.get(pid, {})
              record = {
                  "index": index,
                  "id": pid,
                  "photo": photo,
                  "name": meta.get("name", ""),
                  "category": meta.get("category", ""),
                  "sub": meta.get("sub", ""),
                  "unit": meta.get("unit", ""),
                  "kind": (
                      "search" if "catalog-search-" in photo else
                      "auto" if "catalog-auto-" in photo else
                      "catalog" if "catalog-" in photo else "other"
                  ),
                  "ok": False,
              }

              url = "https://order.bujafood.kr" + photo
              out = root / f"{index:03d}__{pid}.webp"
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 (GitHub Actions Catalog Review)",
                          "Accept": "image/webp,image/*,*/*;q=0.8",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read()
                      ctype = response.headers.get("content-type", "")
                  if not body:
                      raise RuntimeError("empty response")
                  out.write_bytes(body)
                  record["ok"] = True
                  record["bytes"] = len(body)
                  record["content_type"] = ctype
              except Exception as exc:
                  record["error"] = str(exc)
              manifest.append(record)
              if index % 40 == 0:
                  print(f"downloaded {index}/283", flush=True)
              time.sleep(0.03)

          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          ok = sum(1 for r in manifest if r["ok"])
          search_ok = sum(1 for r in manifest if r["ok"] and r["kind"] == "search")
          print(f"FINAL ok={ok}/283 search_ok={search_ok}", flush=True)

      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: catalog-photo-review-1-283
          path: review-1-283
          if-no-files-found: error
          retention-days: 2
