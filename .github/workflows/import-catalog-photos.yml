name: Import catalog photos to R2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-catalog-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for production deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 10 --max-time 30               "https://order.bujafood.kr/api/store?photoStatus=1" > /tmp/photo-status.json; then
              cat /tmp/photo-status.json
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "Production photo status endpoint did not become available"
            exit 1
          fi

      - name: Import all photo sources
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            out="$(curl -fsS --retry 2 --retry-delay 2 --max-time 180               "https://order.bujafood.kr/api/store?photoImport=1")"
            echo "$out"
            done_flag="$(printf '%s' "$out" | python -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("done"))).lower())')"
            remaining="$(printf '%s' "$out" | python -c 'import json,sys; print(json.load(sys.stdin).get("remainingSources",999))')"
            if [ "$done_flag" = "true" ] || [ "$remaining" = "0" ]; then
              break
            fi
          done

      - name: Retry failed sources
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status="$(curl -fsS --retry 2 --retry-delay 2 --max-time 60               "https://order.bujafood.kr/api/store?photoStatus=1")"
            echo "$status"
            failed="$(printf '%s' "$status" | python -c 'import json,sys; print(json.load(sys.stdin).get("failedCount",999))')"
            if [ "$failed" = "0" ]; then
              break
            fi
            curl -fsS --retry 2 --retry-delay 2 --max-time 180               "https://order.bujafood.kr/api/store?photoImport=1&retry=1"
            echo
          done

      - name: Save final status
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 60             "https://order.bujafood.kr/api/store?photoStatus=1"             > photo-import-result.json
          cat photo-import-result.json
          python - <<'PY'
          import json
          with open("photo-import-result.json", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("sourceIndex") != data.get("totalSources"):
              raise SystemExit("Not all photo sources were processed")
          if data.get("failedCount") != 0:
              raise SystemExit(f"Photo source failures remain: {data.get('failedCount')}")
          if data.get("linkedProducts", 0) < 566:
              raise SystemExit(f"Only {data.get('linkedProducts')} products linked")
          if not data.get("done"):
              raise SystemExit("Photo import did not finish cleanly")
          PY

      - name: Commit import result
        if: always()
        shell: bash
        run: |
          if [ ! -f photo-import-result.json ]; then
            echo '{"error":"workflow did not reach final status step"}' > photo-import-result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-import-result.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record catalog photo import result"
          git push
