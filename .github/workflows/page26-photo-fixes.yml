name: Verify admin page 26 photo fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/page26-photo-fixes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for deployment and verify live photo paths
        shell: python
        run: |
          import json, time, urllib.request
          expected = {
            "ERP-32387": "/api/photo?id=catalog-admin-page26-501-erp-32387.webp",
            "ERP-32589": "/api/photo?id=catalog-admin-page26-502-erp-32589.webp",
            "ERP-32571": "/api/photo?id=catalog-admin-page26-503-erp-32571.webp",
            "ERP-32975": "/api/photo?id=catalog-admin-page26-505-erp-32975.webp",
            "ERP-32856": "/api/photo?id=catalog-admin-page26-506-erp-32856.webp",
            "ERP-30150": "/api/photo?id=catalog-admin-page26-507-erp-30150.webp",
            "ERP-31878": "/api/photo?id=catalog-admin-page26-508-erp-31878.webp",
            "ERP-32965": "/api/photo?id=catalog-admin-page26-510-erp-32965.webp",
            "ERP-33022": "/api/photo?id=catalog-admin-page26-511-erp-33022.webp",
            "ERP-32388": "/api/photo?id=catalog-admin-page26-514-erp-32388.webp",
            "ERP-30422": "/api/photo?id=catalog-admin-page26-515-erp-30422.webp",
            "ERP-31883": "/api/photo?id=catalog-admin-page26-517-erp-31883.webp",
            "ERP-32869": "/api/photo?id=catalog-admin-page26-518-erp-32869.webp",
            "ERP-32982": "/api/photo?id=catalog-admin-page26-520-erp-32982.webp",
          }
          url = "https://order.bujafood.kr/api/store?catalogPhotoReviewAll=1"
          last = {}
          for attempt in range(1, 81):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (GitHub Actions Catalog Review)","Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = json.loads(r.read())
                  photos = {p.get("id"): p.get("photo","") for p in data.get("products") or []}
                  last = {k: photos.get(k,"") for k in expected}
                  bad = {k:(last[k],v) for k,v in expected.items() if last[k] != v}
                  print("attempt", attempt, "remaining", len(bad))
                  if not bad:
                      print("PAGE26_FIXES_OK", len(expected))
                      for k,v in expected.items():
                          print("PHOTO_OK", k, v)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print("attempt", attempt, "error", exc)
              time.sleep(10)
          print("FINAL_MISMATCH", {k:(last.get(k),v) for k,v in expected.items() if last.get(k) != v})
          raise SystemExit(1)
